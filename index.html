    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .nav {

    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; z-index: 300; }
    .hamburger span { display: block; width: 24px; height: 2px; background: #FFFDF4; border-radius: 2px; transition: all 0.2s; }
    .hamburger.open span { background: #4D271B; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* DROPDOWN */
    .dropdown { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 250; background: rgba(255,253,240,0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(77,39,27,0.1); padding: 5rem 2rem 2rem; flex-direction: column; }
    .dropdown.open { display: flex; }
    .dropdown a { color: #4D271B; text-decoration: none; font-size: 1.2rem; font-weight: 700; opacity: 0.6; padding: 1rem 0; border-bottom: 1px solid rgba(77,39,27,0.08); transition: opacity 0.2s; }
    .dropdown a:last-child { border-bottom: none; }
    .dropdown a:hover { opacity: 1; }

    /* CONTENT */

    .logo { width: min(520px, 72vw); height: auto; margin-bottom: 1.4rem; }
    .tagline { font-family: Georgia, serif; font-style: italic; font-size: 1.1rem; color: #FFFDF4; line-height: 1.5; margin-bottom: 0; }

    /* FOOTER */

    .footer-copy { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.65rem; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(77,39,27,0.75); }
    .footer-social { display: flex; gap: 1rem; align-items: center; margin-top: 0.25rem; }
    .footer-social-link { color: rgba(77,39,27,0.55); transition: color 0.2s; display: flex; align-items: center; }
    .footer-social-link:hover { color: rgba(77,39,27,0.9); }

<script>
window.toggleMenu = function() {
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('dropdown').classList.toggle('open');
};
document.addEventListener('click', function(e) {
  var btn = document.getElementById('hamburger');
  var drop = document.getElementById('dropdown');
  if (drop.classList.contains('open') && !drop.contains(e.target) && !btn.contains(e.target)) {
    btn.classList.remove('open');
    drop.classList.remove('open');
  }
});
</script>
